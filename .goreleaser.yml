project_name: krew-pause
release:
  github:
    owner: denraf
    name: krew-pause
builds:
  - id: krew-pause
    goos:
    - linux
    - windows
    goarch:
    - amd64
    - "386"
    env:
      - CGO_ENABLED=0
      - GO111MODULE=on
    main: cmd/plugin/main.go
    ldflags: -s -w -X github.com/denraf/krew-pause/pkg/version.version=
  - id: krew-pause-darwin
    goos:
    - darwin
    goarch:
    - amd64
    - arm64
    main: cmd/plugin/main.go
    ldflags: -s -w -X github.com/denraf/krew-pause/pkg/version.Version=
archives:
  - id: krew-pause
    builds:
    - krew-pause
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
    - goos: windows
      format: zip
  - id: krew-pause-darwin
    builds:
    - krew-pause-darwin
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
snapshot:
  name_template: SNAPSHOT-{{ .Commit }}