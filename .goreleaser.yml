project_name: krew-pause
release:
  github:
    owner: denraf
    name: krew-pause
builds:
  - id: krew-pause
    goos:
    - linux
    - windows
    - darwin
    goarch:
    - amd64
    - "386"
    env:
      - CGO_ENABLED=0
      - GO111MODULE=on
    main: cmd/plugin/main.go
    ldflags: -s -w
      -X github.com/denraf/krew-pause/pkg/version.version=
archives:
  - id: krew-pause
    builds:
    - krew-pause
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
    - goos: windows
      format: zip
