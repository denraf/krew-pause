apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: krew-pause
spec:
  version: "v0.1.0"
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/denraf/krew-pause/releases/download/v0.1.0/krew-pause_linux_amd64.tar.gz
    sha256: ""
    files:
    - from: "./krew-pause"
      to: "."
    - from: LICENSE
      to: "."
    bin: "krew-pause"
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/denraf/krew-pause/releases/download/v0.1.0/krew-pause_darwin_amd64.tar.gz
    sha256: ""
    files:
    - from: "./krew-pause"
      to: "."
    - from: LICENSE
      to: "."
    bin: "krew-pause"
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/denraf/krew-pause/releases/download/v0.1.0/krew-pause_windows_amd64.zip
    sha256: ""
    files:
    - from: "/krew-pause.exe"
      to: "."
    - from: LICENSE
      to: "."
    bin: "krew-pause.exe"
  shortDescription: A new plugin
  homepage: https://github.com/denraf/krew-pause
  caveats: |
    Usage:
      $ kubectl krew-pause

    For additional options:
      $ kubectl krew-pause --help
      or https://github.com/denraf/krew-pause/blob/v0.1.0/doc/USAGE.md

  description: |
    This is a new plugin
